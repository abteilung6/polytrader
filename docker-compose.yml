services:
  postgres:
    image: postgres:16-alpine
    container_name: polytrader-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-polytrader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-polytrader}
      POSTGRES_DB: ${DB_DATABASE:-polytrader}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-polytrader} -d ${DB_DATABASE:-polytrader}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: polytrader-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host metrics server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      - postgres

volumes:
  postgres_data:
  prometheus_data:
