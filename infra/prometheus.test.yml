# Prometheus configuration for test environment
# Per Commit 7: Test Prometheus instance on port 9091
# Scrapes metrics from host.docker.internal:9100 (test metrics server)
# Faster scrape interval (5s) for faster test feedback

global:
  scrape_interval: 5s  # Faster for tests
  evaluation_interval: 5s
  external_labels:
    cluster: 'polytrader'
    environment: 'test'

scrape_configs:
  - job_name: 'polytrader-test'
    static_configs:
      - targets: ['host.docker.internal:9100']  # Test metrics server
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s
