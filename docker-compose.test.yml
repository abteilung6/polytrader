services:
  postgres-test:
    image: postgres:16-alpine
    container_name: polytrader-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: polytrader_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d polytrader_test"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for speed
